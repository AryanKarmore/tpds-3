version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: civictrack-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: civictrack
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/views.sql:/docker-entrypoint-initdb.d/02-views.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - civictrack-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civictrack-backend
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: civictrack
      PORT: 5000
      JWT_SECRET: civictrack_super_secret_jwt_key_2026
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - civictrack-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civictrack-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - civictrack-network

volumes:
  mysql_data:
  uploads_data:

networks:
  civictrack-network:
    driver: bridge

